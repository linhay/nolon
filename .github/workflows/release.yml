name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.1.6)"
        required: true
        type: string
      release_channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      changelog_file:
        description: "Optional changelog file path (e.g. docs/RELEASE_NOTES_2.1.6.md)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    # Repo currently has no registered self-hosted runners. Use GitHub-hosted
    # macOS 26 so Swift tools version 6.2 packages resolve under Xcode 26.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print toolchain versions
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Load runner local release env (optional)
        run: |
          set -euo pipefail
          ENV_FILE="${HOME}/.nolon/release-secrets/release.env"
          if [ ! -f "${ENV_FILE}" ]; then
            echo "No local release env found at ${ENV_FILE}; fallback to GitHub Secrets."
            exit 0
          fi

          echo "Loading release env from ${ENV_FILE}"
          echo "HAS_LOCAL_RELEASE_ENV=1" >> "${GITHUB_ENV}"
          set -a
          # shellcheck disable=SC1090
          source "${ENV_FILE}"
          set +a

          vars=(
            SPARKLE_PRIVATE_KEY
            SPARKLE_KEYCHAIN_ACCOUNT
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_P12_PASSWORD
            MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64
            MACOS_PROVISIONING_PROFILE_BASE64
            XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER
            XCODE_PROVISIONING_PROFILE_SPECIFIER
            SIGNING_IDENTITY
            NOTARY_PROFILE
            APPLE_ID
            APPLE_APP_PASSWORD
            TEAM_ID
          )

          for key in "${vars[@]}"; do
            value="${!key:-}"
            if [ -n "${value}" ]; then
              {
                echo "${key}<<EOF"
                printf '%s\n' "${value}"
                echo "EOF"
              } >> "${GITHUB_ENV}"
            fi
          done

      - name: Ensure branch checkout for manual runs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)?$ ]]; then
            echo "Invalid version: ${{ github.event.inputs.version }}"
            exit 1
          fi

      - name: Validate required secrets
        env:
          SPARKLE_PRIVATE_KEY_SECRET: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_KEYCHAIN_ACCOUNT_SECRET: ${{ secrets.SPARKLE_KEYCHAIN_ACCOUNT }}
          MACOS_CERTIFICATE_P12_BASE64_SECRET: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_P12_PASSWORD_SECRET: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64_SECRET: ${{ secrets.MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64 }}
          MACOS_PROVISIONING_PROFILE_BASE64_SECRET: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER_SECRET: ${{ secrets.XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER }}
          XCODE_PROVISIONING_PROFILE_SPECIFIER_SECRET: ${{ secrets.XCODE_PROVISIONING_PROFILE_SPECIFIER }}
          SIGNING_IDENTITY_SECRET: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_PROFILE_SECRET: ${{ secrets.NOTARY_PROFILE }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD_SECRET: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID_SECRET: ${{ secrets.TEAM_ID }}
        run: |
          HAS_LOCAL_RELEASE_ENV="${HAS_LOCAL_RELEASE_ENV:-0}"
          : "${SPARKLE_PRIVATE_KEY:=${SPARKLE_PRIVATE_KEY_SECRET:-}}"
          : "${SPARKLE_KEYCHAIN_ACCOUNT:=${SPARKLE_KEYCHAIN_ACCOUNT_SECRET:-}}"
          : "${MACOS_CERTIFICATE_P12_BASE64:=${MACOS_CERTIFICATE_P12_BASE64_SECRET:-}}"
          : "${MACOS_CERTIFICATE_P12_PASSWORD:=${MACOS_CERTIFICATE_P12_PASSWORD_SECRET:-}}"
          : "${MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64:=${MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64_SECRET:-}}"
          : "${MACOS_PROVISIONING_PROFILE_BASE64:=${MACOS_PROVISIONING_PROFILE_BASE64_SECRET:-}}"
          : "${XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER:=${XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER_SECRET:-}}"
          : "${XCODE_PROVISIONING_PROFILE_SPECIFIER:=${XCODE_PROVISIONING_PROFILE_SPECIFIER_SECRET:-}}"
          : "${SIGNING_IDENTITY:=${SIGNING_IDENTITY_SECRET:-}}"
          : "${NOTARY_PROFILE:=${NOTARY_PROFILE_SECRET:-}}"
          : "${APPLE_ID:=${APPLE_ID_SECRET:-}}"
          : "${APPLE_APP_PASSWORD:=${APPLE_APP_PASSWORD_SECRET:-}}"
          : "${TEAM_ID:=${TEAM_ID_SECRET:-}}"

          if [ -z "${SIGNING_IDENTITY:-}" ]; then
            echo "Missing required secret: SIGNING_IDENTITY"
            exit 1
          fi

          if [ "${HAS_LOCAL_RELEASE_ENV}" != "1" ] && [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "Missing required secret for hosted release: SPARKLE_PRIVATE_KEY"
            exit 1
          fi

          if [ "${HAS_LOCAL_RELEASE_ENV}" != "1" ] && { [ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ] || [ -z "${MACOS_CERTIFICATE_P12_PASSWORD:-}" ]; }; then
            echo "Missing required secrets for hosted release: MACOS_CERTIFICATE_P12_BASE64 / MACOS_CERTIFICATE_P12_PASSWORD"
            exit 1
          fi

          if [ -z "${MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "Missing required archive provisioning profile payload: MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64"
            exit 1
          fi

          if [ -z "${XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER:-}" ]; then
            echo "Missing required archive provisioning profile name: XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER"
            exit 1
          fi

          if [ -z "${MACOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "Missing required Developer ID provisioning profile payload: MACOS_PROVISIONING_PROFILE_BASE64"
            exit 1
          fi

          if [ -z "${XCODE_PROVISIONING_PROFILE_SPECIFIER:-}" ]; then
            echo "Missing required Developer ID provisioning profile name: XCODE_PROVISIONING_PROFILE_SPECIFIER"
            exit 1
          fi

          if [ -z "${NOTARY_PROFILE:-}" ] && { [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_PASSWORD:-}" ] || [ -z "${TEAM_ID:-}" ]; }; then
            echo "Missing notarization credentials. Provide NOTARY_PROFILE or APPLE_ID + APPLE_APP_PASSWORD + TEAM_ID."
            exit 1
          fi

      - name: Resolve release parameters
        id: params
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "ci_tag_mode=1" >> "$GITHUB_OUTPUT"
            echo "release_push_branch=main" >> "$GITHUB_OUTPUT"
            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "changelog_file=" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ci_tag_mode=0" >> "$GITHUB_OUTPUT"
            echo "release_push_branch=" >> "$GITHUB_OUTPUT"
            echo "release_channel=${{ github.event.inputs.release_channel }}" >> "$GITHUB_OUTPUT"
            echo "changelog_file=${{ github.event.inputs.changelog_file }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64_SECRET: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_P12_PASSWORD_SECRET: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:=${MACOS_CERTIFICATE_P12_BASE64_SECRET:-}}"
          : "${MACOS_CERTIFICATE_P12_PASSWORD:=${MACOS_CERTIFICATE_P12_PASSWORD_SECRET:-}}"

          if [ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ] || [ -z "${MACOS_CERTIFICATE_P12_PASSWORD:-}" ]; then
            echo "No P12 certificate payload provided; skip temporary keychain import."
            exit 0
          fi

          CERT_PATH="${RUNNER_TEMP}/nolon-signing.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/nolon-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${MACOS_CERTIFICATE_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          rm -f "${CERT_PATH}"

      - name: Install provisioning profiles
        env:
          MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64_SECRET: ${{ secrets.MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64 }}
          MACOS_PROVISIONING_PROFILE_BASE64_SECRET: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER_SECRET: ${{ secrets.XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER }}
          XCODE_PROVISIONING_PROFILE_SPECIFIER_SECRET: ${{ secrets.XCODE_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          : "${MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64:=${MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64_SECRET:-}}"
          : "${MACOS_PROVISIONING_PROFILE_BASE64:=${MACOS_PROVISIONING_PROFILE_BASE64_SECRET:-}}"
          : "${XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER:=${XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER_SECRET:-}}"
          : "${XCODE_PROVISIONING_PROFILE_SPECIFIER:=${XCODE_PROVISIONING_PROFILE_SPECIFIER_SECRET:-}}"

          if [ -z "${MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64:-}" ] || [ -z "${MACOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "Missing provisioning profile payload."
            exit 1
          fi

          if [ -z "${XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER:-}" ] || [ -z "${XCODE_PROVISIONING_PROFILE_SPECIFIER:-}" ]; then
            echo "Missing provisioning profile name."
            exit 1
          fi

          PROFILE_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${PROFILE_DIR}"
          
          install_profile() {
            local payload="$1"
            local expected_name="$2"
            local profile_path="$3"
            local profile_plist="$4"

            printf '%s' "${payload}" | base64 --decode > "${profile_path}"

            if ! security cms -D -i "${profile_path}" > "${profile_plist}"; then
              echo "Failed to decode provisioning profile payload."
              wc -c "${profile_path}" || true
              exit 1
            fi

            PROFILE_NAME="$(plutil -extract Name raw -o - "${profile_plist}")"
            PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "${profile_plist}")"
            PROFILE_TYPE="$(plutil -extract ProvisionsAllDevices raw -o - "${profile_plist}" 2>/dev/null || true)"
            echo "Installed provisioning profile at ${profile_path}"
            echo "Profile name: ${PROFILE_NAME}"
            echo "Profile app id: ${PROFILE_APP_ID}"
            if [ "${PROFILE_NAME}" != "${expected_name}" ]; then
              echo "Provisioning profile name mismatch. Expected '${expected_name}', got '${PROFILE_NAME}'."
              exit 1
            fi
          }

          install_profile \
            "${MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64}" \
            "${XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER}" \
            "${PROFILE_DIR}/nolon-archive.provisionprofile" \
            "${RUNNER_TEMP}/nolon-archive-profile.plist"

          install_profile \
            "${MACOS_PROVISIONING_PROFILE_BASE64}" \
            "${XCODE_PROVISIONING_PROFILE_SPECIFIER}" \
            "${PROFILE_DIR}/nolon-release.provisionprofile" \
            "${RUNNER_TEMP}/nolon-release-profile.plist"

      - name: Run release script
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY_SECRET: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_KEYCHAIN_ACCOUNT_SECRET: ${{ secrets.SPARKLE_KEYCHAIN_ACCOUNT }}
          MACOS_PROVISIONING_PROFILE_BASE64_SECRET: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64_SECRET: ${{ secrets.MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64 }}
          XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER_SECRET: ${{ secrets.XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER }}
          XCODE_PROVISIONING_PROFILE_SPECIFIER_SECRET: ${{ secrets.XCODE_PROVISIONING_PROFILE_SPECIFIER }}
          SIGNING_IDENTITY_SECRET: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_PROFILE_SECRET: ${{ secrets.NOTARY_PROFILE }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD_SECRET: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID_SECRET: ${{ secrets.TEAM_ID }}
          CI_TAG_MODE: ${{ steps.params.outputs.ci_tag_mode }}
          RELEASE_PUSH_BRANCH: ${{ steps.params.outputs.release_push_branch }}
          RELEASE_CHANNEL: ${{ steps.params.outputs.release_channel }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:=${SPARKLE_PRIVATE_KEY_SECRET:-}}"
          : "${SPARKLE_KEYCHAIN_ACCOUNT:=${SPARKLE_KEYCHAIN_ACCOUNT_SECRET:-}}"
          : "${MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64:=${MACOS_ARCHIVE_PROVISIONING_PROFILE_BASE64_SECRET:-}}"
          : "${MACOS_PROVISIONING_PROFILE_BASE64:=${MACOS_PROVISIONING_PROFILE_BASE64_SECRET:-}}"
          : "${XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER:=${XCODE_ARCHIVE_PROVISIONING_PROFILE_SPECIFIER_SECRET:-}}"
          : "${XCODE_PROVISIONING_PROFILE_SPECIFIER:=${XCODE_PROVISIONING_PROFILE_SPECIFIER_SECRET:-}}"
          : "${SIGNING_IDENTITY:=${SIGNING_IDENTITY_SECRET:-}}"
          : "${NOTARY_PROFILE:=${NOTARY_PROFILE_SECRET:-}}"
          : "${APPLE_ID:=${APPLE_ID_SECRET:-}}"
          : "${APPLE_APP_PASSWORD:=${APPLE_APP_PASSWORD_SECRET:-}}"
          : "${TEAM_ID:=${TEAM_ID_SECRET:-}}"

          chmod +x scripts/release.sh scripts/build-dmg.sh
          export USE_XCODE_OFFICIAL_SIGNING=1
          export XCODE_EXPORT_METHOD=developer-id
          export XCODE_ARCHIVE_SIGNING_STYLE=automatic
          export XCODE_EXPORT_SIGNING_STYLE=manual
          export XCODE_EXPORT_SIGNING_CERTIFICATE="${SIGNING_IDENTITY}"
          export XCODE_EXPORT_PROVISIONING_PROFILE_SPECIFIER="${XCODE_PROVISIONING_PROFILE_SPECIFIER}"
          if [ -n "${{ steps.params.outputs.changelog_file }}" ]; then
            ./scripts/release.sh "${{ steps.params.outputs.version }}" "${{ steps.params.outputs.changelog_file }}"
          else
            ./scripts/release.sh "${{ steps.params.outputs.version }}"
          fi

      - name: Cleanup signing keychain
        if: ${{ always() }}
        run: |
          rm -f "${RUNNER_TEMP}/nolon-signing.p12" || true
          security delete-keychain "${RUNNER_TEMP}/nolon-signing.keychain-db" || true
          rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/nolon-archive.provisionprofile" || true
          rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/nolon-release.provisionprofile" || true
