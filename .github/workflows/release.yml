name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.1.6)"
        required: true
        type: string
      release_channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      changelog_file:
        description: "Optional changelog file path (e.g. docs/RELEASE_NOTES_2.1.6.md)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    # Repo currently has no registered self-hosted runners. Use GitHub-hosted
    # macOS so manual and tag-driven releases remain executable.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print toolchain versions
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Load runner local release env (optional)
        run: |
          set -euo pipefail
          ENV_FILE="${HOME}/.nolon/release-secrets/release.env"
          if [ ! -f "${ENV_FILE}" ]; then
            echo "No local release env found at ${ENV_FILE}; fallback to GitHub Secrets."
            exit 0
          fi

          echo "Loading release env from ${ENV_FILE}"
          set -a
          # shellcheck disable=SC1090
          source "${ENV_FILE}"
          set +a

          vars=(
            SPARKLE_PRIVATE_KEY
            SPARKLE_KEYCHAIN_ACCOUNT
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_P12_PASSWORD
            SIGNING_IDENTITY
            NOTARY_PROFILE
            APPLE_ID
            APPLE_APP_PASSWORD
            TEAM_ID
          )

          for key in "${vars[@]}"; do
            value="${!key:-}"
            if [ -n "${value}" ]; then
              {
                echo "${key}<<EOF"
                printf '%s\n' "${value}"
                echo "EOF"
              } >> "${GITHUB_ENV}"
            fi
          done

      - name: Ensure branch checkout for manual runs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)?$ ]]; then
            echo "Invalid version: ${{ github.event.inputs.version }}"
            exit 1
          fi

      - name: Validate required secrets
        env:
          SPARKLE_PRIVATE_KEY_SECRET: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_KEYCHAIN_ACCOUNT_SECRET: ${{ secrets.SPARKLE_KEYCHAIN_ACCOUNT }}
          SIGNING_IDENTITY_SECRET: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:=${SPARKLE_PRIVATE_KEY_SECRET:-}}"
          : "${SPARKLE_KEYCHAIN_ACCOUNT:=${SPARKLE_KEYCHAIN_ACCOUNT_SECRET:-}}"
          : "${SIGNING_IDENTITY:=${SIGNING_IDENTITY_SECRET:-}}"

          if [ -z "${SIGNING_IDENTITY:-}" ]; then
            echo "Missing required secret: SIGNING_IDENTITY"
            exit 1
          fi

          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "SPARKLE_PRIVATE_KEY not provided; will fallback to Sparkle keychain account (${SPARKLE_KEYCHAIN_ACCOUNT:-ed25519})."
          fi

      - name: Resolve release parameters
        id: params
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "ci_tag_mode=1" >> "$GITHUB_OUTPUT"
            echo "release_push_branch=main" >> "$GITHUB_OUTPUT"
            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "changelog_file=" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ci_tag_mode=0" >> "$GITHUB_OUTPUT"
            echo "release_push_branch=" >> "$GITHUB_OUTPUT"
            echo "release_channel=${{ github.event.inputs.release_channel }}" >> "$GITHUB_OUTPUT"
            echo "changelog_file=${{ github.event.inputs.changelog_file }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64_SECRET: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_P12_PASSWORD_SECRET: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:=${MACOS_CERTIFICATE_P12_BASE64_SECRET:-}}"
          : "${MACOS_CERTIFICATE_P12_PASSWORD:=${MACOS_CERTIFICATE_P12_PASSWORD_SECRET:-}}"

          if [ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ] || [ -z "${MACOS_CERTIFICATE_P12_PASSWORD:-}" ]; then
            echo "No P12 certificate payload provided; skip temporary keychain import."
            exit 0
          fi

          CERT_PATH="${RUNNER_TEMP}/nolon-signing.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/nolon-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${MACOS_CERTIFICATE_P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          rm -f "${CERT_PATH}"

      - name: Run release script
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY_SECRET: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_KEYCHAIN_ACCOUNT_SECRET: ${{ secrets.SPARKLE_KEYCHAIN_ACCOUNT }}
          SIGNING_IDENTITY_SECRET: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_PROFILE_SECRET: ${{ secrets.NOTARY_PROFILE }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD_SECRET: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID_SECRET: ${{ secrets.TEAM_ID }}
          CI_TAG_MODE: ${{ steps.params.outputs.ci_tag_mode }}
          RELEASE_PUSH_BRANCH: ${{ steps.params.outputs.release_push_branch }}
          RELEASE_CHANNEL: ${{ steps.params.outputs.release_channel }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:=${SPARKLE_PRIVATE_KEY_SECRET:-}}"
          : "${SPARKLE_KEYCHAIN_ACCOUNT:=${SPARKLE_KEYCHAIN_ACCOUNT_SECRET:-}}"
          : "${SIGNING_IDENTITY:=${SIGNING_IDENTITY_SECRET:-}}"
          : "${NOTARY_PROFILE:=${NOTARY_PROFILE_SECRET:-}}"
          : "${APPLE_ID:=${APPLE_ID_SECRET:-}}"
          : "${APPLE_APP_PASSWORD:=${APPLE_APP_PASSWORD_SECRET:-}}"
          : "${TEAM_ID:=${TEAM_ID_SECRET:-}}"

          chmod +x scripts/release.sh scripts/build-dmg.sh
          if [ -n "${{ steps.params.outputs.changelog_file }}" ]; then
            ./scripts/release.sh "${{ steps.params.outputs.version }}" "${{ steps.params.outputs.changelog_file }}"
          else
            ./scripts/release.sh "${{ steps.params.outputs.version }}"
          fi

      - name: Cleanup signing keychain
        if: ${{ always() }}
        run: |
          rm -f "${RUNNER_TEMP}/nolon-signing.p12" || true
          security delete-keychain "${RUNNER_TEMP}/nolon-signing.keychain-db" || true
